[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polytracker-portfolio-showcase"
version = "0.1.0"
description = "A sanitized, standalone showcase of data-ingestion and feature-pipeline patterns."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

